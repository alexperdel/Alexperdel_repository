<!doctype html>
<!-- Portada del perfil de LinkedIn (1584×396). La foto de perfil tapa la esquina
     inferior izquierda: ahí solo va trama. Se genera con Chrome sin ventana. -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Merriweather:wght@700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { position: relative; font-family: 'Archivo', sans-serif; color: #141414;
         background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)),
                     url("../assets/img/libro/trama-flujos.svg") center / cover no-repeat, #F6B331; }
  .bloque { position: absolute; left: 500px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: flex-start; }
  .caja { background: #141414; color: #fff; border-radius: 18px; padding: 20px 28px 24px; text-transform: uppercase;
          line-height: .9; text-align: center; box-shadow: 0 20px 40px -20px rgba(0,0,0,.6); }
  .g { display: block; font-size: 106px; letter-spacing: -3px; }
  .p { display: block; font-size: 32px; margin-top: 6px; }
  .sub { font-family: 'Merriweather', serif; font-size: 19px; line-height: 1.3; background: #fff; border-radius: 999px;
         padding: 12px 24px; margin-top: 16px; box-shadow: 0 12px 24px -12px rgba(0,0,0,.45); }
  .sub em { font-style: normal; color: #E3262B; }
  .pie { margin-top: 14px; font-family: 'Merriweather', serif; font-size: 20px; font-weight: 700; }
  .pie b { font-family: 'Archivo'; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; font-size: 15px;
           background: #141414; color: #fff; border-radius: 999px; padding: 5px 12px 5px 22px; position: relative; margin-right: 10px; }
  .pie b::before { content: ""; position: absolute; left: 9px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; background: #E3262B; }
  img { position: absolute; right: 20px; top: -6px; height: 408px; filter: drop-shadow(0 26px 34px rgba(0,0,0,.25)); }
</style></head>
<body>
  <div class="bloque">
    <div class="caja"><span class="g">Hiper</span><span class="p">automatizaciones</span></div>
    <div class="sub">Manual <em>honesto</em> y <em>sin humos</em> para <em>automatizar de verdad</em> tu empresa</div>
    <p class="pie"><b>Mi primer libro</b>alexperdel.com/hiperautomatizaciones</p>
  </div>
  <img src="../assets/img/libro/mockup-libros-apilados.webp" alt="">
</body></html>
