<!doctype html>
<!-- Miniatura del reel para LinkedIn (1080×1350, 4:5). Se genera con Chrome sin ventana:
     ver la orden al final de tools/reel-libro/README.md -->
<html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@900&family=Merriweather:wght@700&display=swap">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body { background: linear-gradient(rgba(255,255,255,.14), rgba(255,255,255,.14)),
                     url("../assets/img/libro/trama-flujos.svg") center / cover no-repeat, #F6B331;
         display: flex; flex-direction: column; align-items: center; font-family: 'Archivo', sans-serif; }
  img { width: 1100px; margin-top: -120px; margin-bottom: -150px; filter: drop-shadow(0 34px 44px rgba(0,0,0,.24)); }
  .caja { position: relative; z-index: 2; background: #141414; color: #fff; border-radius: 30px; padding: 36px 52px 42px; text-align: center;
          text-transform: uppercase; line-height: .9; box-shadow: 0 30px 60px -28px rgba(0,0,0,.6); }
  .g { display: block; font-size: 190px; letter-spacing: -6px; }
  .p { display: block; font-size: 57px; margin-top: 10px; }
  .sub { position: relative; z-index: 2; font-family: 'Merriweather', serif; font-size: 40px; line-height: 1.32; background: #fff; text-align: center;
         border-radius: 999px; padding: 26px 48px; margin-top: 34px; box-shadow: 0 18px 34px -16px rgba(0,0,0,.45); }
  .sub em { font-style: normal; color: #E3262B; }
</style></head>
<body>
  <img src="../assets/img/libro/mockup-libros-apilados.webp" alt="">
  <div class="caja"><span class="g">Hiper</span><span class="p">automatizaciones</span></div>
  <div class="sub">Manual <em>honesto</em> y <em>sin humos</em> para<br><em>automatizar de verdad</em> tu empresa</div>
</body></html>
