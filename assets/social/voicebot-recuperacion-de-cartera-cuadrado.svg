<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="Un voicebot que llama a cobrar">
  <title>Un voicebot que llama a cobrar</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B3554"/><stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <pattern id="t" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#F4EFE5" stroke-opacity="0.055" stroke-width="1"/>
      <line x1="13" y1="0" x2="13" y2="26" stroke="#F4EFE5" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <style>
      .f { font-family: Calibri, Carlito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="url(#g)"/>
  <rect width="1080" height="1080" fill="url(#t)"/>

  <text class="f" x="1020" y="945" text-anchor="end"
        font-size="216" font-weight="800" letter-spacing="-0.035em"
        fill="none" stroke="#F4EFE5" stroke-opacity="0.2" stroke-width="2">Vapi</text>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" rx="22" ry="22" width="96" height="44" fill="none" stroke="#F4EFE5" stroke-opacity="0.35" stroke-width="1.5"/>
    <text class="f" x="22" y="30" font-size="19" font-weight="700" letter-spacing="0.16em" fill="#F4EFE5">VAPI</text>
  </g>

  <text class="f" x="60" y="540" font-size="54" font-weight="800" letter-spacing="-0.02em" fill="#F4EFE5">Un voicebot que llama a cobrar</text>

  <text class="f" x="60" y="1020" font-size="22" font-weight="600" letter-spacing="0.06em" fill="#F4EFE5" fill-opacity="0.6">alexperdel.com</text>
</svg>
