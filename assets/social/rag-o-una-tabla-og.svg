<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="¿Necesitas un RAG o te vale una tabla?">
  <title>¿Necesitas un RAG o te vale una tabla?</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12273F"/><stop offset="100%" stop-color="#1B3554"/>
    </linearGradient>
    <pattern id="t" width="26" height="26" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)">
      <line x1="0" y1="0" x2="0" y2="26" stroke="#F4EFE5" stroke-opacity="0.055" stroke-width="1"/>
      <line x1="13" y1="0" x2="13" y2="26" stroke="#F4EFE5" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <style>
      .f { font-family: Calibri, Carlito, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#t)"/>

  <text class="f" x="1134" y="552" text-anchor="end"
        font-size="240" font-weight="800" letter-spacing="-0.035em"
        fill="none" stroke="#F4EFE5" stroke-opacity="0.2" stroke-width="2">RAG</text>

  <g transform="translate(66, 66)">
    <rect x="0" y="0" rx="22" ry="22" width="83" height="44" fill="none" stroke="#F4EFE5" stroke-opacity="0.35" stroke-width="1.5"/>
    <text class="f" x="22" y="30" font-size="19" font-weight="700" letter-spacing="0.16em" fill="#F4EFE5">RAG</text>
  </g>

  <text class="f" x="66" y="285" font-size="60" font-weight="800" letter-spacing="-0.02em" fill="#F4EFE5">¿Necesitas un RAG<tspan x="66" dy="72">o te vale una tabla?</tspan></text>

  <text class="f" x="66" y="564" font-size="22" font-weight="600" letter-spacing="0.06em" fill="#F4EFE5" fill-opacity="0.6">alexperdel.com</text>
</svg>
